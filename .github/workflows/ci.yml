name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install
        run: uv sync --extra dev --extra yaml --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Type-check
        run: uv run mypy src/revoco --ignore-missing-imports

      - name: Tests
        run: uv run pytest tests -q

      # Ship-blocking checks. Each of these encodes a rule the package makes about
      # itself, so a change that quietly breaks one should not reach main.
      - name: Adapter registries are valid
        run: |
          for f in examples/inverses_*.json; do
            echo "== $f"
            uv run revoco inverses-check "$f"
          done

      - name: Starter policy is valid
        run: uv run revoco policy-check examples/policy.yaml

      - name: Containment benchmark
        # Exits non-zero on an unexpected loss or any false positive. A scenario
        # whose designed outcome is loss does not fail the build; a regression that
        # starts losing something new does.
        run: uv run revoco bench

      - name: Validate the workstation adapter against a real filesystem and git
        # The only adapter that can be validated without a vendor sandbox. It drills
        # every inverse against real files and a real `git init` repo, and probes the
        # prose claims the classifications rest on. Keeping it in CI is what stops the
        # 14 specs sliding back to "unvalidated" the next time someone edits them.
        run: uv run python scripts/validate_workstation.py

      - name: Threat-scanner calibration
        # Gated, but the gate stands down below 30 attack samples. ATBench is not
        # fetched here, so this runs on the bundled corpus and reports without
        # failing — a noisy-pattern verdict on three attacks reflects which attacks
        # the corpus happens to contain, not a property of the pattern. Set
        # ATBENCH_PATH in a job that fetches it to enforce.
        run: uv run revoco calibrate

      - name: End-to-end demo
        run: uv run python -m revoco.demo

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Validate package metadata
        run: uvx twine check dist/*

      # A wheel that imports in the repo root but not from a clean install is the
      # classic packaging failure, and it is invisible until someone pip-installs it.
      - name: Install the wheel somewhere clean and use it
        run: |
          uv venv /tmp/fresh
          uv pip install --python /tmp/fresh/bin/python dist/*.whl
          /tmp/fresh/bin/revoco surfaces
          /tmp/fresh/bin/python -c "import revoco; print('version', revoco.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------------
  # The enforcer. These jobs are the reason the two projects share a repository:
  # a change to revoco's rule language now fails recoup's conformance in the same
  # CI run that introduced it, rather than in a different repo whenever someone
  # next bumped the dependency. That gap already shipped a bug once — a floor-only
  # rule compiled to an empty posture list, which the enforcer reads as "any
  # posture", silently widening an allow rule to admit irreversible work.
  # ---------------------------------------------------------------------------
  enforcer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recoup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Formatting and vet
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt would change files:"; gofmt -l .; exit 1; }
          go vet ./...

      - name: Conformance against frozen verdicts
        run: go test -count=1 ./...

      - name: The fixtures must catch a deliberate bug
        run: python3 conformance/mutate.py
        env:
          GO_BIN: go

  enforcer-agrees-with-revoco:
    # The fixtures are generated from revoco's own engine. Regenerating them
    # against the revoco in *this tree* — not the one on PyPI — is what makes a
    # rule-language change visible here immediately. A diff means revoco's
    # decisions moved or the golden files were hand-edited; both need a human.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install both packages from the tree
        run: |
          pip install -e .
          pip install -e ./recoup

      - name: Control-plane checks
        working-directory: recoup
        run: python test_analyse.py

      - name: A compiled policy must prove clean or fail loudly
        working-directory: recoup
        run: |
          python -m recoup.cli compile <(echo '{"name":"ci","version":"1","default_effect":"deny","rules":[{"id":"no-undo","effect":"require_approval","reversibility":["irreversible","unknown"]},{"id":"ok","effect":"allow","min_reversibility":"compensable"}]}') -o /tmp/ci-bundle.json
          python -m recoup.cli prove /tmp/ci-bundle.json --strict

      - name: Fixtures must reproduce from this tree's revoco
        working-directory: recoup
        run: |
          python -m recoup.generate
          if ! git diff --quiet -- conformance/fixtures; then
            echo "Regenerating the fixtures changed them. Either revoco's decisions"
            echo "moved, or the golden files were edited by hand. Review the diff:"
            git --no-pager diff -- conformance/fixtures
            exit 1
          fi
