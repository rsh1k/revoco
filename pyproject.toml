[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revoco"
version = "0.5.20"
description = "Undo for AI agent actions. Plans the rollback before the action runs, proves it still works, and rolls back a compromised grant's whole blast radius in one call."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "rsh1k" }]
keywords = [
    "ai-agents", "agentic-ai", "ai-security", "rollback", "undo",
    "reversibility", "compensating-transaction", "agent-governance",
    "audit-trail", "tamper-evident", "mcp", "guardrails",
    "owasp", "nist", "eu-ai-act", "sox", "sr-11-7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pyyaml>=6.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
revoco = "revoco.cli:main"

[project.urls]
Homepage = "https://github.com/rsh1k/revoco"
Source = "https://github.com/rsh1k/revoco"

[tool.hatch.build.targets.wheel]
packages = ["src/revoco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
