[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revoco"
version = "0.2.0"
description = "An action control plane for AI agents: delegated authority, per-action policy enforcement, reversible execution, and regulator-grade evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "rsh1k" }]
keywords = [
    "ai-security", "ai-agents", "agentic-ai", "governance", "audit",
    "owasp", "nist", "eu-ai-act", "sox", "mcp", "rollback",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pyyaml>=6.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
revoco = "revoco.cli:main"

[project.urls]
Homepage = "https://github.com/rsh1k/revoco"
Source = "https://github.com/rsh1k/revoco"

[tool.hatch.build.targets.wheel]
packages = ["src/revoco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
