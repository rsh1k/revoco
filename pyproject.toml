[project]
name = "recoup"
version = "0.1.0"
description = "Containment and recovery control plane for AI agents: decide before the action whether a real undo exists."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "rsh1k" }]
dependencies = ["revoco>=0.5.2"]

[project.urls]
Homepage = "https://github.com/rsh1k/recoup"

[project.scripts]
recoup = "recoup.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recoup*"]
